viewport:
  width: 1440
  height: 1024

canonicalRoute: /ko/multiscale

defaults:
  stepProgress: 0.52
  preResetWaitMs: 260
  postResetWaitMs: 700
  imageChecks:
    - type: occupancy
      minFraction: 0.015
      maxFraction: 0.92
    - type: centroid
      xRange: [0.05, 0.95]
      yRange: [0.05, 0.95]

scenes:
  - sceneId: 01-dft-outputs
    level: dft
    stepIndex: 0
    postResetWaitMs: 1800
  - sceneId: 02-dft-scf
    level: dft
    stepIndex: 1

  - sceneId: 03-mlff-why
    level: mlff
    stepIndex: 0
  - sceneId: 04-mlff-energy-force
    level: mlff
    stepIndex: 1

  - sceneId: 05-allatom-observables
    level: allatom
    stepIndex: 0
  - sceneId: 06-allatom-force-field
    level: allatom
    stepIndex: 1

  - sceneId: 07-meso-collective
    level: meso
    stepIndex: 0
  - sceneId: 08-meso-mapping
    level: meso
    stepIndex: 1
